# Authentication defaults. Import this profile or copy the properties into your active profile.
auth.access-token-lifetime=PT10M
jwt.issuer=infyro-farm-connect
jwt.audience=infyro-api
auth.refresh.idle-lifetime=PT168H
auth.refresh.absolute-lifetime=P30D
# Local HTTP development only. Production must set APP_COOKIE_SECURE=true.
app.cookie.secure=false
app.cookie.same-site=Lax
app.cors.allowed-origin=http://localhost:5173
