# Local development database configuration.
# Override these environment variables for your own MySQL instance.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/infyro_farm_connect}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns schema creation and upgrades; Hibernate only verifies mappings.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
