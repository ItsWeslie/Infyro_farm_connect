name: Maven tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, "feature/expense-and-harvest-records" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run Maven test suite
        run: mvn --batch-mode --no-transfer-progress clean test
